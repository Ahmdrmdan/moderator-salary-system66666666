<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>نظام إدارة رواتب المشرفين</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body { height: 100%; margin: 0; background: #0f1115; }
    .boot-wrap {
      height: 100%; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; font-family: 'Segoe UI', sans-serif;
    }
    .spinner {
      width: 38px; height: 38px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.15); border-top-color: #3d5afe;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #a3a9b7; font-size: 14px; }
  </style>
</head>
<body>
  <div class="boot-wrap">
    <div class="spinner"></div>
    <p>جاري التحميل...</p>
  </div>

  <!-- Firebase SDK (compat build - no bundler required) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script>
    // This redirect page only needs Authentication. Loading firebase.js here
    // also opened Firestore and enabled persistence immediately before the
    // dashboard opened it again, which could leave a fresh dashboard waiting
    // on Firestore initialization. Keep this document auth-only.
    const productionFirebaseConfig = {
      apiKey: 'AIzaSyATJ2LZPKvuBs5QRoKltf8aTRUvIr7gtC0',
      authDomain: 'ahmed123-95a0e.firebaseapp.com',
      projectId: 'ahmed123-95a0e',
      appId: '1:185531326850:web:de360bc1d60bc013be6f9b'
    };
    const uatFirebaseConfig = {
      apiKey: 'AIzaSyC_Q6lIEotujGBvFQoUQxntQ3QSAC8v--U',
      authDomain: 'ahmed123-95a0e-uat.firebaseapp.com',
      projectId: 'ahmed123-95a0e-uat',
      appId: '1:45101979532:web:ce9fc762d21d344c92a8a9'
    };
    const isUatHost = window.location.hostname.includes('ahmed123-95a0e-uat');
    firebase.initializeApp(isUatHost ? uatFirebaseConfig : productionFirebaseConfig);
    const rootAuth = firebase.auth();
    if (['127.0.0.1', 'localhost'].includes(window.location.hostname)) {
      rootAuth.useEmulator('http://127.0.0.1:9099', { disableWarnings: true });
    }

    // Route to the dashboard if already authenticated, otherwise to login.
    rootAuth.onAuthStateChanged((user) => {
      // Keep the dashboard document in step with its cache-revalidated scripts
      // after a Hosting deployment.
      window.location.replace(user ? 'dashboard.html?v=7.0.19-final-audit' : 'login.html');
    });
  </script>
</body>
</html>
